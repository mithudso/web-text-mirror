name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax
        run: |
          python -m compileall -q scripts tests
          bash -n scripts/install.sh
          node --check chrome-plugin/background.js
          node --check chrome-plugin/sidepanel.js
      - name: Lint
        run: ruff check scripts/ tests/
      - name: Offline Python tests
        run: |
          python tests/test_text_mirror.py
          python -m unittest discover -s tests -p test_regressions.py -v
      - name: Extension fixture tests
        run: node --test tests/test_sidepanel.js
      - name: Static reference drift
        run: python scripts/maintain_docs.py --check
